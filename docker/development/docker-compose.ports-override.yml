# Host-port remap for machines where 3306/9200/9300 are already taken by the
# eai-docker stack (ragflow-mysql / ragflow-es). Must be passed explicitly:
#   docker compose -f docker/development/docker-compose.yml \
#     -f docker/development/docker-compose.ports-override.yml up -d
services:
  mysql:
    ports: !override
      - "13306:3306"
  elasticsearch:
    ports: !override
      - "19200:9200"
      - "19300:9300"
